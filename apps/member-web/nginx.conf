server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Consent API 由 auth-server 提供；以變數延後 DNS 解析，auth-server 尚未部署時 nginx 仍可啟動。
    location /api/v1/oauth/ {
        resolver 127.0.0.11 valid=10s;
        set $auth_server http://auth-server:8080;
        proxy_pass $auth_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://member-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    location /health {
        proxy_pass http://member-api:8080/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
