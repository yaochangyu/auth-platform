server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 換票端點與 API 都以同源代理，避免 CORS；以變數延後 DNS 解析，後端尚未就緒時 nginx 仍可啟動。
    location ~ ^/connect/(token|userinfo)$ {
        resolver 127.0.0.11 valid=10s;
        set $auth_server http://auth-server:8091;
        proxy_pass $auth_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登出要由簽發 Session Cookie 的 member-api 註銷；精確比對優先於下面的 /api/。
    location = /api/v1/auth/logout {
        resolver 127.0.0.11 valid=10s;
        set $member_server http://member-api:8080;
        proxy_pass $member_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_server http://developer-api:8080;
        proxy_pass $api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
